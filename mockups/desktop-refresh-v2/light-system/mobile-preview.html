<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ведарама — мобильный макет</title><style>@font-face{font-family:PT;src:url(assets/PTSans-Regular.ttf)}*{box-sizing:border-box}body{margin:0;font:16px/1.5 PT,sans-serif;background:#ededee;color:#27282b}main{max-width:1000px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:26px;margin:0}p{font-size:14px;max-width:640px}a{color:inherit}.sizes{display:flex;gap:6px;justify-content:center;margin:24px auto 16px}button{font:inherit;border:1px solid #dad8dd;border-radius:9px;padding:8px 16px;background:#fefefe;cursor:pointer}button[aria-pressed=true]{background:#efc869}iframe{display:block;width:390px;height:844px;max-width:100%;margin:0 auto;border:1px solid #dad8dd;border-radius:20px;box-shadow:0 12px 40px #27282b12;background:#fefefe}footer{text-align:center;font-size:12px;margin:18px 0;color:#3a3c40}@media(max-width:500px){main{padding:20px 8px}header,p{padding:0 10px}iframe{border-radius:12px}}</style></head><body><main><header><h1>Ведарама на телефоне</h1><a href="index.html?v=4.9">Открыть полный макет ↗</a></header><p>Это тот же интерактивный макет в окне телефона. Переключайте тему сверху, а разделы — в нижней навигации.</p><div class="sizes" role="group" aria-label="Ширина экрана"><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button></div><iframe src="index.html?v=4.9" title="Интерактивный мобильный макет Ведарамы"></iframe><footer>Светлая и тёмная темы · каталог · чтение · справочники · полки и закладки · AI</footer></main><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});</script></body></html>
